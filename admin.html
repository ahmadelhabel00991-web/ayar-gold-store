<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم | عيار جولد</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma;background:#f6f3ec;color:#191712}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:#201c15}.loginbox{background:white;padding:28px;border-radius:24px;width:min(390px,90vw)}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd3be;border-radius:10px;margin:5px 0 12px}.btn{border:0;border-radius:11px;padding:10px 15px;background:#211d16;color:white;font-weight:800;cursor:pointer}.app{display:none}.app.show{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#211d16;color:white;padding:22px}.side h2{color:#f0d37b}.side button,.side a{display:block;width:100%;text-align:right;background:transparent;border:0;color:#d8d0c0;padding:11px;border-radius:9px;cursor:pointer;text-decoration:none}.side button.active{background:#ffffff12;color:#f0d37b}.main{padding:28px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:white;border:1px solid #e6dece;border-radius:18px;padding:18px}.card b{font-size:26px}.panel{margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.prices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.p{background:#f4eddc;border-radius:12px;padding:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:right;font-size:13px}.actions{display:flex;gap:6px}.danger{background:#9d3e3e}.good{color:#21724f}.warn{color:#ad6c18}.top{display:flex;justify-content:space-between;align-items:center}.modal{display:none;position:fixed;inset:0;background:#0008;padding:18px}.modal.show{display:grid;place-items:center}.box{background:white;border-radius:18px;padding:20px;width:min(700px,95vw);max-height:90vh;overflow:auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:850px){.app.show{grid-template-columns:1fr}.side{position:static}.cards,.prices{grid-template-columns:1fr 1fr}.grid,.two{grid-template-columns:1fr}.table{font-size:12px}}
</style></head><body><div class="login" id="login"><form class="loginbox" onsubmit="doLogin(event)"><h2>لوحة إدارة عيار جولد</h2><p>نسخة الاختبار</p><input id="user" value="admin" placeholder="المستخدم"><input id="pass" type="password" placeholder="كلمة المرور"><button class="btn" style="width:100%">دخول</button><small>الافتراضي: admin / ChangeMe123!</small><div id="err"></div></form></div>
<div class="app" id="app"><aside class="side"><h2>عيار جولد</h2><button class="active" onclick="view='dash';draw()">نظرة عامة</button><button onclick="view='prices';draw()">أسعار الذهب</button><button onclick="view='products';draw()">المنتجات والمخزون</button><button onclick="view='orders';draw()">الطلبات</button><button onclick="view='settings';draw()">إعدادات المتجر</button><a href="index.html">فتح المتجر ↗</a><button onclick="logout()">تسجيل الخروج</button></aside><main class="main"><div class="top"><div><h1 id="title">نظرة عامة</h1><div id="sub"></div></div></div><div id="content"></div></main></div>
<div class="modal" id="prodModal"><div class="box"><div class="top"><h2>منتج</h2><button class="btn" onclick="closeModal()">×</button></div><div class="two"><input id="pn" placeholder="اسم المنتج"><input id="pc" placeholder="الفئة"><select id="pk"><option>24</option><option>22</option><option selected>21</option><option>18</option><option>14</option></select><input id="pw" type="number" step=".01" placeholder="الوزن"><input id="pwork" type="number" step=".01" placeholder="المصنعية / غ"><input id="pfixed" type="number" step=".01" placeholder="مصنعية ثابتة"><input id="pmargin" type="number" step=".01" placeholder="هامش الربح %"><input id="pstock" type="number" placeholder="الكمية"></div><button class="btn" onclick="saveProduct()">حفظ</button></div></div>
<script>
const KEY='ayar_store_db_v2',purity={24:1,22:.916,21:.875,18:.75,14:.585};function now(){return new Date().toISOString()}function seed(){return{settings:{brand:'عيار جولد',currency:'₪',whatsapp:'970597303227',instagram:'https://instagram.com/',messenger:'https://m.me/',about:'متجر ذهب إلكتروني حديث يضع السعر والوزن والعيار أمام العميل بوضوح.'},sell24:395,buy24:389,prices:{},products:[],orders:[],updated:now()}}function load(){let d=JSON.parse(localStorage.getItem(KEY)||'null')||seed();if(!d.products.length)d.products=[{id:1,name:'خاتم كلاسيك',cat:'خواتم',k:21,w:4.35,work:8,fixed:10,margin:4,stock:6,auto:true},{id:2,name:'سلسال لمعة',cat:'سلاسل',k:21,w:8.7,work:10,fixed:18,margin:5,stock:4,auto:true},{id:3,name:'إسوارة نبض',cat:'أساور',k:21,w:11.2,work:9,fixed:15,margin:4.5,stock:3,auto:true},{id:4,name:'سبيكة 10 غرام',cat:'سبائك',k:24,w:10,work:2,fixed:0,margin:1.5,stock:10,auto:true}];calcP(d);return d}function calcP(d){[24,22,21,18,14].forEach(k=>d.prices[k]={sell:+(d.sell24*purity[k]).toFixed(2),buy:+(d.buy24*purity[k]).toFixed(2)})}function save(){db.updated=now();calcP(db);localStorage.setItem(KEY,JSON.stringify(db))}function price(p){let base=db.prices[p.k].sell*p.w+p.work*p.w+p.fixed;return +(base*(1+p.margin/100)).toFixed(2)}function money(n){return Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' '+db.settings.currency}let db=load(),view='dash',editId=0;
function doLogin(e){e.preventDefault();if(user.value==='admin'&&pass.value==='ChangeMe123!'){localStorage.setItem('ayar_admin','1');start()}else err.textContent='بيانات الدخول غير صحيحة'}function start(){login.style.display='none';app.classList.add('show');draw()}function logout(){localStorage.removeItem('ayar_admin');location.reload()}if(localStorage.getItem('ayar_admin')==='1')start();
function draw(){document.querySelectorAll('.side button').forEach(b=>b.classList.remove('active'));if(view==='dash')dash();if(view==='prices')prices();if(view==='products')products();if(view==='orders')orders();if(view==='settings')settings()}
function dash(){title.textContent='نظرة عامة';let today=new Date().toISOString().slice(0,10),tod=db.orders.filter(o=>o.created.slice(0,10)===today),low=db.products.filter(p=>p.stock<=2).length,total=db.products.reduce((s,p)=>s+price(p)*p.stock,0);content.innerHTML='<div class="cards"><div class="card">طلبات اليوم<b>'+tod.length+'</b></div><div class="card">مبيعات اليوم<b>'+money(tod.reduce((s,o)=>s+o.total,0))+'</b></div><div class="card">مخزون منخفض<b>'+low+'</b></div><div class="card">قيمة المخزون<b>'+money(total)+'</b></div></div><div class="panel"><h2>آخر الطلبات</h2>'+orderTable(db.orders.slice(0,7))+'</div>'}
function prices(){title.textContent='أسعار الذهب';content.innerHTML='<div class="panel"><div class="grid"><label>بيع 24K<input id="sell24" type="number" step=".01" value="'+db.sell24+'"></label><label>شراء 24K<input id="buy24" type="number" step=".01" value="'+db.buy24+'"></label></div><button class="btn" onclick="savePrices()">تحديث الأسعار</button><div class="prices">'+[24,22,21,18,14].map(k=>'<div class="p"><b>'+k+'K</b><br>بيع '+money(db.prices[k].sell)+'<br>شراء '+money(db.prices[k].buy)+'</div>').join('')+'</div></div>'}function savePrices(){db.sell24=+sell24.value;db.buy24=+buy24.value;save();prices()}
function products(){title.textContent='المنتجات والمخزون';content.innerHTML='<div class="panel"><button class="btn" onclick="openProduct()">+ إضافة منتج</button><table class="table"><tr><th>المنتج</th><th>العيار</th><th>الوزن</th><th>السعر</th><th>المخزون</th><th></th></tr>'+db.products.map(p=>'<tr><td><b>'+p.name+'</b><br>'+p.cat+'</td><td>'+p.k+'K</td><td>'+p.w+'غ</td><td>'+money(price(p))+'</td><td class="'+(p.stock<=2?'warn':'good')+'">'+p.stock+'</td><td class="actions"><button class="btn" onclick="openProduct('+p.id+')">تعديل</button><button class="btn danger" onclick="removeP('+p.id+')">حذف</button></td></tr>').join('')+'</table></div>'}function openProduct(id=0){editId=id;let p=db.products.find(x=>x.id===id)||{name:'',cat:'خواتم',k:21,w:0,work:0,fixed:0,margin:0,stock:1};pn.value=p.name;pc.value=p.cat;pk.value=p.k;pw.value=p.w;pwork.value=p.work;pfixed.value=p.fixed;pmargin.value=p.margin;pstock.value=p.stock;prodModal.classList.add('show')}function closeModal(){prodModal.classList.remove('show')}function saveProduct(){let p={id:editId||Math.max(0,...db.products.map(x=>x.id))+1,name:pn.value,cat:pc.value,k:+pk.value,w:+pw.value,work:+pwork.value,fixed:+pfixed.value,margin:+pmargin.value,stock:+pstock.value,auto:true};if(editId)db.products[db.products.findIndex(x=>x.id===editId)]=p;else db.products.push(p);save();closeModal();products()}function removeP(id){if(confirm('حذف المنتج؟')){db.products=db.products.filter(x=>x.id!==id);save();products()}}
function orderTable(a){return '<table class="table"><tr><th>الرقم</th><th>العميل</th><th>المدينة</th><th>الحالة</th><th>الإجمالي</th></tr>'+a.map(o=>'<tr><td>'+o.code+'</td><td>'+o.name+'</td><td>'+o.city+'</td><td><select onchange="setStatus(\''+o.code+'\',this.value)"><option '+(o.status==='جديد'?'selected':'')+'>جديد</option><option '+(o.status==='مؤكد'?'selected':'')+'>مؤكد</option><option '+(o.status==='تجهيز'?'selected':'')+'>تجهيز</option><option '+(o.status==='مشحون'?'selected':'')+'>مشحون</option><option '+(o.status==='مكتمل'?'selected':'')+'>مكتمل</option><option '+(o.status==='ملغي'?'selected':'')+'>ملغي</option></select></td><td>'+money(o.total)+'</td></tr>').join('')+'</table>'}function orders(){title.textContent='الطلبات';content.innerHTML='<div class="panel">'+orderTable(db.orders)+'</div>'}function setStatus(code,s){let o=db.orders.find(x=>x.code===code);if(o){o.status=s;save()}}
function settings(){title.textContent='إعدادات المتجر';let s=db.settings;content.innerHTML='<div class="panel grid"><label>اسم المتجر<input id="brand" value="'+s.brand+'"></label><label>العملة<input id="currency" value="'+s.currency+'"></label><label>واتساب<input id="whatsapp" value="'+s.whatsapp+'"></label><label>إنستجرام<input id="instagram" value="'+s.instagram+'"></label><label>ماسنجر<input id="messenger" value="'+s.messenger+'"></label><label>من نحن<textarea id="about">'+s.about+'</textarea></label><button class="btn" onclick="saveSettings()">حفظ الإعدادات</button></div>'}function saveSettings(){db.settings={brand:brand.value,currency:currency.value,whatsapp:whatsapp.value,instagram:instagram.value,messenger:messenger.value,about:about.value};save();settings()}
</script></body></html>
